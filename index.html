<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡轉繁小工具</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#546B41">

    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding: 25px;
            min-height: 100vh;
            margin: 0;
            color: #FFF8EC;
            background: radial-gradient(circle at top left, rgba(153,173,122,0.12), transparent 30%), radial-gradient(circle at bottom right, rgba(220,204,172,0.08), transparent 35%), linear-gradient(135deg, #1E241B 0%, #2C3526 50%, #161B14 100%);
        }

        h2 {
            font-size: 30px;
            text-align: center;
            color: #FFF8EC;
        }

        h3 {
            text-align: center;
            color: #DCCCAC;
        }

        input, textarea, .info, .result, .log {
            width: 100%;
            color: #FFF8EC;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 14px;
            margin-bottom: 12px;
        }

        textarea {
            height: 220px;
            font-size: 16px;
            line-height: 1.7;
            resize: vertical;
            outline: none;
        }

            textarea::placeholder {
                color: rgba(255,248,236,0.4);
            }

        button {
            width: 100%;
            padding: 15px;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #FFF8EC;
            background: linear-gradient(135deg, #546B41, #99AD7A);
            border: none;
            border-radius: 18px;
            cursor: pointer;
        }

            button:hover {
                filter: brightness(1.1);
            }

        .result, .log {
            white-space: pre-wrap;
            min-height: 100px;
        }

        .log {
            color: #DCCCAC;
            font-size: 14px;
            line-height: 1.8;
        }

        @media (max-width:600px) {
            body {
                padding: 18px;
            }

            h2 {
                font-size: 25px;
            }

            textarea {
                height: 200px;
            }
        }
    </style>
</head>

<body>

    <h2>簡轉繁小工具</h2>

    <input type="file" id="csvFile" accept=".csv,.txt,.tsv">

    <div class="info" id="dictionaryName">尚未載入字庫</div>
    <div class="info" id="openccStatus">基礎簡轉繁載入中……</div>

<textarea id="inputText" placeholder="貼上簡體文字"></textarea>

    <button onclick="convertText()">開始轉換</button>
    <button onclick="copyResult()">複製結果</button>
    <button onclick="clearAll()">清空</button>
    <button onclick="clearSavedDictionary()">刪除已儲存字庫</button>

    <h3>轉換結果</h3>
    <div class="result" id="result"></div>

    <h3>替換紀錄</h3>
    <div class="log" id="replaceLog">尚無紀錄</div>

    <script>
        let dictionary = {};
        let openccConverter = null;

        document.getElementById('csvFile').addEventListener('change', handleFileUpload);
        window.addEventListener('load', initApp);

        function initApp() {
            initOpenCC();
            loadSavedDictionary();
        }

        function initOpenCC() {
            if (window.OpenCC && OpenCC.Converter) {
                openccConverter = OpenCC.Converter({ from: 'cn', to: 'tw' });
                document.getElementById('openccStatus').innerText = '基礎簡轉繁：已啟用 OpenCC';
            } else {
                document.getElementById('openccStatus').innerText = '基礎簡轉繁：未載入，將只套用字庫';
            }
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();

            reader.onload = function (e) {
                const text = e.target.result;

                parseDictionary(text);

                localStorage.setItem('savedDictionaryText', text);
                localStorage.setItem('savedDictionaryName', file.name);

                document.getElementById('dictionaryName').innerText =
                    `已載入字庫：${file.name}，共 ${Object.keys(dictionary).length} 筆`;

                alert("字庫載入完成，已自動儲存！");
            };

            reader.readAsText(file, 'UTF-8');
        }

        function loadSavedDictionary() {
            const savedText = localStorage.getItem('savedDictionaryText');
            const savedName = localStorage.getItem('savedDictionaryName');

            if (!savedText) return;

            parseDictionary(savedText);

            document.getElementById('dictionaryName').innerText =
                `已自動載入上次字庫：${savedName || '未命名字庫'}，共 ${Object.keys(dictionary).length} 筆`;
        }

        function clearSavedDictionary() {
            localStorage.removeItem('savedDictionaryText');
            localStorage.removeItem('savedDictionaryName');

            dictionary = {};

            document.getElementById('dictionaryName').innerText = '尚未載入字庫';
            document.getElementById('replaceLog').innerText = '尚無紀錄';

            alert("已刪除儲存的字庫");
        }

        function parseDictionary(text) {
            dictionary = {};

            const lines = text.split(/\r?\n/);

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                if (i === 0 && (
                    line.toLowerCase().includes('source') ||
                    line.includes('簡體') ||
                    line.includes('简体')
                )) {
                    continue;
                }

                let parts = line.includes('\t') ? line.split('\t') : parseCSVLine(line);

                if (parts.length < 2) continue;

                const source = parts[0].trim();
                const target = parts[1].trim();

                if (source && target) {
                    dictionary[source] = target;
                }
            }
        }

        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;

            for (let i = 0; i < line.length; i++) {
                const char = line[i];

                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === ',' && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }

            result.push(current);
            return result;
        }

        function convertText() {
            let text = document.getElementById('inputText').value;

            if (!text.trim()) {
                alert("請先貼上要轉換的文字");
                return;
            }

            const replaceRecords = [];
            const protectedTerms = [];

            const entries = Object.entries(dictionary)
                .sort((a, b) => b[0].length - a[0].length);

            for (const [source, target] of entries) {
                if (text.includes(source)) {
                    const count = text.split(source).length - 1;
                    const placeholder = `__CUSTOM_TERM_${protectedTerms.length}__`;

                    text = text.split(source).join(placeholder);

                    protectedTerms.push({
                        placeholder,
                        target
                    });

                    replaceRecords.push(`${source} → ${target}（${count} 次）`);
                }
            }

            if (openccConverter) {
                text = openccConverter(text);
            }

            for (const item of protectedTerms) {
                text = text.split(item.placeholder).join(item.target);
            }

            document.getElementById('result').innerText = text;

            const baseLog = openccConverter
                ? '已套用基礎簡轉繁：OpenCC cn → tw'
                : '未套用基礎簡轉繁：OpenCC 未載入';

            document.getElementById('replaceLog').innerText =
                [
                    replaceRecords.length > 0
                        ? replaceRecords.join('\n')
                        : '沒有符合字庫的詞條',
                    '',
                    baseLog
                ].join('\n');
        }

        function copyResult() {
            const result = document.getElementById('result').innerText;

            if (!result.trim()) {
                alert("目前沒有可複製的結果");
                return;
            }

            navigator.clipboard.writeText(result)
                .then(function () {
                    alert("已複製結果！");
                })
                .catch(function () {
                    alert("複製失敗，請手動選取結果複製");
                });
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('result').innerText = '';
            document.getElementById('replaceLog').innerText = '尚無紀錄';
        }
    </script>

</body>
</html>
